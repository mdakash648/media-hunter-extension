<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Media Hunter</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0a0c10;
      --surface: #111318;
      --surface2: #1a1d24;
      --border: #252830;
      --accent: #00e5ff;
      --accent2: #ff4081;
      --accent3: #69ff47;
      --text: #e8eaf0;
      --muted: #6b7280;
      --video: #00e5ff;
      --audio: #ff4081;
      --media: #69ff47;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      width: 480px;
      min-height: 200px;
      max-height: 600px;
      background: var(--bg);
      color: var(--text);
      font-family: 'Rajdhani', sans-serif;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* Header */
    .header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 12px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      flex-shrink: 0;
    }

    .logo {
      width: 32px;
      height: 32px;
      background: linear-gradient(135deg, var(--accent), #0066ff);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      flex-shrink: 0;
    }

    .header-text h1 {
      font-family: 'Rajdhani', sans-serif;
      font-size: 18px;
      font-weight: 700;
      color: var(--accent);
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .header-text p {
      font-size: 11px;
      color: var(--muted);
      font-family: 'JetBrains Mono', monospace;
    }

    .scan-btn {
      margin-left: auto;
      background: var(--accent);
      color: #000;
      border: none;
      padding: 7px 16px;
      border-radius: 6px;
      font-family: 'Rajdhani', sans-serif;
      font-weight: 700;
      font-size: 13px;
      letter-spacing: 1px;
      cursor: pointer;
      transition: all 0.2s;
      flex-shrink: 0;
    }

    .scan-btn:hover { background: #00b8d4; transform: scale(1.04); }
    .scan-btn:disabled { background: var(--muted); cursor: not-allowed; transform: none; }

    /* Stats bar */
    .stats-bar {
      background: var(--surface2);
      border-bottom: 1px solid var(--border);
      padding: 7px 16px;
      display: flex;
      align-items: center;
      gap: 16px;
      flex-shrink: 0;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
    }

    .stat { display: flex; align-items: center; gap: 5px; }
    .stat-dot { width: 7px; height: 7px; border-radius: 50%; }
    .dot-video { background: var(--video); }
    .dot-audio { background: var(--audio); }
    .dot-media { background: var(--media); }

    .stat-count { font-weight: 700; color: var(--text); }
    .stat-label { color: var(--muted); }

    .total-count {
      margin-left: auto;
      color: var(--accent);
      font-weight: 700;
    }

    /* Filter tabs */
    .filters {
      display: flex;
      gap: 2px;
      padding: 8px 16px 0;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
      background: var(--surface);
    }

    .filter-tab {
      padding: 5px 12px;
      border-radius: 6px 6px 0 0;
      background: transparent;
      border: 1px solid transparent;
      border-bottom: none;
      color: var(--muted);
      font-family: 'Rajdhani', sans-serif;
      font-weight: 600;
      font-size: 12px;
      letter-spacing: 1px;
      cursor: pointer;
      transition: all 0.15s;
    }

    .filter-tab.active {
      background: var(--surface2);
      border-color: var(--border);
      color: var(--accent);
    }

    .filter-tab:hover:not(.active) { color: var(--text); }

    /* Media list */
    .media-list {
      flex: 1;
      overflow-y: auto;
      padding: 8px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .media-list::-webkit-scrollbar { width: 4px; }
    .media-list::-webkit-scrollbar-track { background: transparent; }
    .media-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

    /* Empty / loading states */
    .state-msg {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 32px;
      text-align: center;
    }

    .state-icon { font-size: 40px; opacity: 0.3; }
    .state-title { font-size: 15px; font-weight: 700; color: var(--muted); letter-spacing: 1px; }
    .state-sub { font-size: 12px; color: var(--muted); opacity: 0.6; font-family: 'JetBrains Mono', monospace; }

    /* Spinner */
    .spinner {
      width: 28px; height: 28px;
      border: 3px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Media Card */
    .media-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 12px;
      transition: border-color 0.15s;
    }

    .media-card:hover { border-color: var(--accent); }

    .card-top {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 7px;
    }

    .ext-badge {
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 4px;
      letter-spacing: 1px;
      flex-shrink: 0;
    }

    .badge-VIDEO { background: rgba(0,229,255,0.15); color: var(--video); border: 1px solid rgba(0,229,255,0.3); }
    .badge-AUDIO { background: rgba(255,64,129,0.15); color: var(--audio); border: 1px solid rgba(255,64,129,0.3); }
    .badge-MEDIA { background: rgba(105,255,71,0.15); color: var(--media); border: 1px solid rgba(105,255,71,0.3); }

    .url-text {
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex: 1;
    }

    .card-title-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 5px;
    }

    .card-title {
      font-family: 'Rajdhani', sans-serif;
      font-size: 14px;
      font-weight: 700;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex: 1;
      letter-spacing: 0.3px;
    }

    .card-actions {
      display: flex;
      gap: 6px;
    }

    .btn-copy, .btn-download {
      flex: 1;
      padding: 6px 10px;
      border-radius: 5px;
      border: 1px solid;
      font-family: 'Rajdhani', sans-serif;
      font-weight: 700;
      font-size: 12px;
      letter-spacing: 1px;
      cursor: pointer;
      transition: all 0.15s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
    }

    .btn-copy {
      background: rgba(0,229,255,0.08);
      border-color: rgba(0,229,255,0.3);
      color: var(--accent);
    }
    .btn-copy:hover { background: rgba(0,229,255,0.2); }
    .btn-copy.copied { background: rgba(105,255,71,0.15); border-color: var(--media); color: var(--media); }

    .btn-download {
      background: rgba(255,64,129,0.08);
      border-color: rgba(255,64,129,0.3);
      color: var(--audio);
    }
    .btn-download:hover { background: rgba(255,64,129,0.2); }

    .btn-play {
      flex: 0 0 auto;
      padding: 6px 12px;
      border-radius: 5px;
      border: 1px solid rgba(255,190,0,0.4);
      background: rgba(255,190,0,0.08);
      color: #ffbe00;
      font-family: 'Rajdhani', sans-serif;
      font-weight: 700;
      font-size: 12px;
      letter-spacing: 1px;
      cursor: pointer;
      transition: all 0.15s;
      display: flex;
      align-items: center;
      gap: 4px;
      white-space: nowrap;
    }
    .btn-play:hover { background: rgba(255,190,0,0.22); border-color: rgba(255,190,0,0.7); }

    /* Copy all button */
    .bottom-bar {
      background: var(--surface);
      border-top: 1px solid var(--border);
      padding: 8px 12px;
      display: flex;
      gap: 8px;
      flex-shrink: 0;
    }

    .btn-copy-all {
      flex: 1;
      padding: 7px;
      background: rgba(0,229,255,0.08);
      border: 1px solid rgba(0,229,255,0.25);
      border-radius: 6px;
      color: var(--accent);
      font-family: 'Rajdhani', sans-serif;
      font-weight: 700;
      font-size: 12px;
      letter-spacing: 1px;
      cursor: pointer;
      transition: all 0.15s;
    }
    .btn-copy-all:hover { background: rgba(0,229,255,0.18); }

    .result-count-badge {
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 2px 7px;
      color: var(--muted);
      display: flex;
      align-items: center;
    }

    /* Toast */
    .toast {
      position: fixed;
      bottom: 50px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: var(--accent3);
      color: #000;
      padding: 6px 18px;
      border-radius: 20px;
      font-family: 'Rajdhani', sans-serif;
      font-weight: 700;
      font-size: 13px;
      opacity: 0;
      transition: all 0.3s;
      pointer-events: none;
      z-index: 999;
      white-space: nowrap;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  </style>
</head>
<body>

  <!-- Header -->
  <div class="header">
    <div class="logo">🎯</div>
    <div class="header-text">
      <h1>Media Hunter</h1>
      <p id="pageTitle">স্ক্যান শুরু করতে বাটনে ক্লিক করুন</p>
    </div>
    <button class="scan-btn" id="scanBtn">⚡ স্ক্যান</button>
  </div>

  <!-- Stats -->
  <div class="stats-bar" id="statsBar" style="display:none">
    <div class="stat">
      <div class="stat-dot dot-video"></div>
      <span class="stat-count" id="videoCount">0</span>
      <span class="stat-label">VIDEO</span>
    </div>
    <div class="stat">
      <div class="stat-dot dot-audio"></div>
      <span class="stat-count" id="audioCount">0</span>
      <span class="stat-label">AUDIO</span>
    </div>
    <div class="stat">
      <div class="stat-dot dot-media"></div>
      <span class="stat-count" id="mediaCount">0</span>
      <span class="stat-label">OTHER</span>
    </div>
    <div class="total-count" id="totalCount">মোট: 0</div>
  </div>

  <!-- Filter tabs -->
  <div class="filters" id="filterBar" style="display:none">
    <button class="filter-tab active" data-filter="ALL">সব</button>
    <button class="filter-tab" data-filter="VIDEO">ভিডিও</button>
    <button class="filter-tab" data-filter="AUDIO">অডিও</button>
    <button class="filter-tab" data-filter="MEDIA">অন্যান্য</button>
  </div>

  <!-- Content area -->
  <div id="content" style="flex:1;display:flex;flex-direction:column;overflow:hidden;">
    <!-- Initial state -->
    <div class="state-msg" id="initState">
      <div class="state-icon">🔍</div>
      <div class="state-title">মিডিয়া খোঁজা হয়নি</div>
      <div class="state-sub">⚡ স্ক্যান বাটন চাপুন</div>
    </div>
  </div>

  <!-- Bottom bar -->
  <div class="bottom-bar" id="bottomBar" style="display:none">
    <button class="btn-copy-all" id="copyAllBtn">📋 সব URL কপি করুন</button>
    <div class="result-count-badge" id="filteredCount">0 টি</div>
  </div>

  <!-- Toast -->
  <div class="toast" id="toast"></div>

  <script src="popup.js"></script>
</body>
</html>
